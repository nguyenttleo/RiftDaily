version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - printf "DATABASE_URL=%s\n" "$DATABASE_URL" >> .env.production
        - printf "NEXTAUTH_URL=%s\n" "$NEXTAUTH_URL" >> .env.production
        - printf "NEXTAUTH_SECRET=%s\n" "$NEXTAUTH_SECRET" >> .env.production
        - printf "NEXT_PUBLIC_APP_URL=%s\n" "$NEXT_PUBLIC_APP_URL" >> .env.production
        - printf "CHALLENGE_SALT=%s\n" "$CHALLENGE_SALT" >> .env.production
        - printf "CRON_SECRET=%s\n" "$CRON_SECRET" >> .env.production
        - printf "RIOT_API_KEY=%s\n" "$RIOT_API_KEY" >> .env.production
        - printf "RIOT_REGION=%s\n" "$RIOT_REGION" >> .env.production
        - printf "RIOT_MATCH_SAMPLE_SIZE=%s\n" "$RIOT_MATCH_SAMPLE_SIZE" >> .env.production
        - printf "RIOT_BUILD_SAMPLE_MATCH_COUNT=%s\n" "$RIOT_BUILD_SAMPLE_MATCH_COUNT" >> .env.production
        - printf "RIOT_MATCHUP_SAMPLE_MATCH_COUNT=%s\n" "$RIOT_MATCHUP_SAMPLE_MATCH_COUNT" >> .env.production
        - printf "RIOT_MATCH_HISTORY_PAGES_PER_SOURCE=%s\n" "$RIOT_MATCH_HISTORY_PAGES_PER_SOURCE" >> .env.production
        - printf "NEXT_PUBLIC_CREATOR_GITHUB_URL=%s\n" "$NEXT_PUBLIC_CREATOR_GITHUB_URL" >> .env.production
        - printf "NEXT_PUBLIC_CREATOR_LINKEDIN_URL=%s\n" "$NEXT_PUBLIC_CREATOR_LINKEDIN_URL" >> .env.production
        - printf "SUGGESTION_EMAIL_ENABLED=%s\n" "$SUGGESTION_EMAIL_ENABLED" >> .env.production
        - printf "SUGGESTION_EMAIL_TO=%s\n" "$SUGGESTION_EMAIL_TO" >> .env.production
        - printf "SUGGESTION_EMAIL_FROM=%s\n" "$SUGGESTION_EMAIL_FROM" >> .env.production
        - printf "SES_SMTP_HOST=%s\n" "$SES_SMTP_HOST" >> .env.production
        - printf "SES_SMTP_PORT=%s\n" "$SES_SMTP_PORT" >> .env.production
        - printf "SES_SMTP_SECURE=%s\n" "$SES_SMTP_SECURE" >> .env.production
        - printf "SES_SMTP_USER=%s\n" "$SES_SMTP_USER" >> .env.production
        - printf "SES_SMTP_PASSWORD=%s\n" "$SES_SMTP_PASSWORD" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
